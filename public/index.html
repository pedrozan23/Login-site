<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>Laboratório de autenticação</title>
</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form>
                <h1>Crie sua conta com</h1>
                <div class="social-icons">
                    <a href="/oauth/login/google" class="icon"><i class="fa-brands fa-google"></i></a>
                </div>
                <span>ou use seu email para o registro</span>
                <input type="text" placeholder="Nome">
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Senha">
                <button>Cadastrar</button>
            </form>
        </div>

        <div class="form-container sign-in">
            <form>
                <h1>Entrar</h1>
                <div class="social-icons">
                    <a href="/oauth/login/google" class="icon"><i class="fa-brands fa-google"></i></a>
                </div>
                <span>ou use seu email e senha</span>
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Senha">
                <a href="#">Esqueceu sua senha?</a>
                <button>Entrar</button>
            </form>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Bem vindo de volta</h1>
                    <p id="status">A sessão ainda não foi consultada.</p>
                    <button class="hidden" id="login">Login</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Olá, Amigo</h1>
                    <p>Registre-se com os seus dados pessoais para usar todos os recursos do site.</p>
                    <button class="hidden" id="registro">Cadastra-se</button>
                </div>
            </div>
        </div>
    </div>

    <form method="post" action="/oauth/logout" style="text-align:center; margin-top:16px;">
        <button type="submit">Sair</button>
    </form>

    <script src="app.js"></script>
</body>
</html>
